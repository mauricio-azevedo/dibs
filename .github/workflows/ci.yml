name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `!` before the colon in the PR title marks a breaking change; `make api-diff` then allows one.
      ALLOW_BREAKING: ${{ contains(github.event.pull_request.title, '!:') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - run: make check

  # The one required status check. It depends on the jobs above and runs nothing of its own, so splitting
  # a job never means editing the ruleset. `if: always()` plus the result check makes it fail, not skip,
  # when a dependency fails; a skipped required check would block the merge with nothing saying why.
  ci:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
