spring.application.name=dibs

# The datasource comes from the environment: SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD. Nothing is
# set here, so a missing value fails the start instead of booting against a default (CONTRIBUTING, Code).

# Flyway owns the schema; Hibernate only checks that the entities match it (CONTRIBUTING, Stack).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Probes on the management port, not the public one (CONTRIBUTING, Stack). /healthz does no I/O;
# /readyz fails when the database is unreachable (CONTRIBUTING, Observability).
server.port=8080
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.additional-path=management:/healthz
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=management:/readyz
